services:
  provisioner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRUENAS_USER: ${TRUENAS_USER:-truenas_admin}
        TRUENAS_UID: ${TRUENAS_UID:-950}
        TRUENAS_GID: ${TRUENAS_GID:-950}
    image: truenas-provisioning-image:local
    container_name: provisioner
    network_mode: host
    extra_hosts:
      - "infisical.iillmaticc.link:127.0.0.1"
    restart: unless-stopped
    environment:
      - REPO_URL=git@github.com:killakam3084/truenas.git
      - REPO_DEST=/mnt/cell_block_d/repos/truenas
      - TRUENAS_USER=truenas_admin
      - TRUENAS_UID=950
      - TRUENAS_GID=950
      - HOME=/home/truenas_admin
    volumes:
      # Monorepo + app configs live here
      - /mnt/cell_block_d:/mnt/cell_block_d
      # SSH key for git clone auth (read-only)
      - /home/truenas_admin/.ssh:/home/truenas_admin/.ssh:ro
      # Docker socket — allows docker/compose CLI commands against host
      - /var/run/docker.sock:/var/run/docker.sock
